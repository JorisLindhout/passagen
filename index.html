<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0ea" />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="Joris Lindhout" />
    <meta
      name="description"
      content="A feed you have to walk through. It learns what you linger on and hangs more of it."
    />
    <title>Passagen</title>
    <link rel="canonical" href="https://passagen.joris.wtf/" />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Passagen" />
    <meta property="og:title" content="Passagen" />
    <meta
      property="og:description"
      content="A feed you have to walk through. It learns what you linger on and hangs more of it."
    />
    <meta property="og:url" content="https://passagen.joris.wtf/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://passagen.joris.wtf/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="932" />
    <meta property="og:image:height" content="488" />
    <meta
      property="og:image:alt"
      content="A hall in Passagen: white walls under a grid of glowing ceiling panels, hung with Japanese prints and hand-colored animal woodcuts"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Passagen" />
    <meta
      name="twitter:description"
      content="A feed you have to walk through. It learns what you linger on and hangs more of it."
    />
    <meta name="twitter:image" content="https://passagen.joris.wtf/og.jpg" />
    <meta
      name="twitter:image:alt"
      content="A hall in Passagen: white walls under a grid of glowing ceiling panels, hung with Japanese prints and hand-colored animal woodcuts"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Passagen",
        "description": "A feed you have to walk through. It learns what you linger on and hangs more of it.",
        "url": "https://passagen.joris.wtf/",
        "image": "https://passagen.joris.wtf/og.jpg",
        "inLanguage": "en",
        "genre": ["Net art", "Virtual museum"],
        "isAccessibleForFree": true,
        "author": {
          "@type": "Person",
          "name": "Joris Lindhout",
          "url": "https://joris.wtf/"
        }
      }
    </script>

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="gate">
        <figure id="epigraph">
          <blockquote>
            <p>There is a goal, but no way; what we call the way is hesitation.</p>
          </blockquote>
          <figcaption>Franz Kafka</figcaption>
        </figure>
        <p id="touch-hint">Drag anywhere with one thumb: up to walk, sideways to turn.</p>
        <button id="walk" type="button" disabled>Hanging pictures…</button>
        <div
          id="loading"
          role="progressbar"
          aria-label="Loading pictures"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span></span>
        </div>
      </div>
      <div id="plaque">
        <div id="plaque-text" aria-live="polite" aria-atomic="true"></div>
        <button
          id="plaque-toggle"
          type="button"
          aria-controls="plaque-text"
          aria-expanded="false"
          aria-label="Show label"
          aria-keyshortcuts="I"
        >
          i
        </button>
      </div>
      <div id="stick" hidden>
        <div id="knob"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
