<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="A first-person walk through plain corridors hung with public-domain art."
    />
    <title>Passagen</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="gate">
        <figure id="epigraph">
          <blockquote>
            <p>There is a goal, but no way; what we call the way is hesitation.</p>
          </blockquote>
          <figcaption>Franz Kafka</figcaption>
        </figure>
        <p id="touch-hint">Drag anywhere with one thumb: up to walk, sideways to turn.</p>
        <button id="walk" type="button" disabled>Hanging pictures…</button>
        <div
          id="loading"
          role="progressbar"
          aria-label="Loading pictures"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span></span>
        </div>
      </div>
      <div id="plaque">
        <div id="plaque-text" aria-live="polite" aria-atomic="true"></div>
        <button
          id="plaque-toggle"
          type="button"
          aria-controls="plaque-text"
          aria-expanded="false"
          aria-label="Show label"
          aria-keyshortcuts="I"
        >
          i
        </button>
      </div>
      <div id="stick" hidden>
        <div id="knob"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
